<!-- ======= Header ======= -->
<header id="header" class="app-header">

  <div class="header-left">
    <button type="button" class="header-menu-btn" (click)="toggleSidebar()" title="Menu">
      <i class="bi bi-list"></i>
    </button>
  </div>

  <div class="header-right">

    <!-- User dropdown -->
    <div class="dropdown">
      <button type="button" class="user-btn" data-bs-toggle="dropdown" aria-expanded="false">
        <div class="user-avatar">
          {{ (currentUser?.prenom || currentUser?.nom || 'U').charAt(0).toUpperCase() }}
        </div>
        <div class="user-info d-none d-md-flex">
          <span class="user-name">{{ (currentUser?.prenom || currentUser?.nom) | titlecase }}</span>
          <span class="user-role">{{ currentUser?.profil?.nom | titlecase }}</span>
        </div>
        <i class="bi bi-chevron-down user-chevron d-none d-md-inline"></i>
      </button>

      <ul class="dropdown-menu dropdown-menu-end user-dropdown">
        <li class="dropdown-header-block">
          <div class="dh-avatar">
            {{ (currentUser?.prenom || currentUser?.nom || 'U').charAt(0).toUpperCase() }}
          </div>
          <div>
            <div class="dh-name">{{ currentUser?.nom }} {{ currentUser?.prenoms }}</div>
            <div class="dh-role">{{ currentUser?.profil?.nom | titlecase }}</div>
          </div>
        </li>
        <li><hr class="dropdown-divider"></li>
        <li>
          <a class="dropdown-item" routerLink="/utilisateurs/edit-user-info">
            <i class="bi bi-person-gear"></i> Mon profil
          </a>
        </li>
        <li><hr class="dropdown-divider"></li>
        <li>
          <button type="button" class="dropdown-item text-danger" (click)="logout()">
            <i class="bi bi-box-arrow-right"></i> Déconnecter
          </button>
        </li>
      </ul>
    </div>

  </div>

</header>
